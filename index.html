function updateClock(){
  const d = new Date();

  const hora = d.toLocaleTimeString("es-MX", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  $("statusTime").textContent = hora;
  $("clock").textContent = hora;
  $("homeclock").textContent = hora;
}

function setDate(){
  const d = new Date();

  const fecha = d.toLocaleDateString("es-MX", {
    weekday: "long",
    day: "numeric",
    month: "long"
  });

  $("date").textContent =
    fecha.charAt(0).toUpperCase() + fecha.slice(1);
}

  function updateDateTime(){
  updateClock();
  setDate();
}

function updateDots(){$$("dot").forEach((d,i)=>d.classList.toggle("filled",i<entered.length));}
function $$(cls){return document.querySelectorAll("."+cls)}
function digit(n){
 if(entered.length>=4)return;
 entered+=n;updateDots();

function addNotification(ev){

 n.querySelector(".nrow b").textContent=ev.title;
 n.querySelector("strong").textContent=ev.headline;
 n.querySelector(".ncontent p").textContent=ev.text;
 n.onclick=()=>{
  if(!unlocked){showPass();return;}
  openApp(ev.type==="x"?"x":ev.type==="brian"?"messages":ev.type==="mateo"?"messages":"x");
  if(ev.type==="brian")openChat("Brian");

}

let touchY=null;

},{passive:true});

 if(e.target.id==="lock"||e.target.id==="lockwall"||e.target.id==="lockhead")showPass();
});
$("phone").addEventListener("touchstart",e=>{
 if(unlocked&&e.touches[0].clientY>window.innerHeight-35)window._homeGesture=e.touches[0].clientY;
},{passive:true});
$("phone").addEventListener("touchend",e=>{
 if(unlocked&&window._homeGesture&&window._homeGesture-e.changedTouches[0].clientY>30){
  if($("appview").style.display==="block")goHome();

 window._homeGesture=null;
},{passive:true});
