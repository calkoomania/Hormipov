/* Dock translúcido */

  bottom: 19px;
  left: 26px;

/* Ocultar el encabezado y widget antiguos */

#widget {

/* Adaptación a móviles pequeños */

  #world-widget {
    margin-left: 15px;

    margin-right: 15px;

    gap: 12px;
  }

  .world-event {
    font-size: 10px;
  }

  .event-pill {

    padding: 7px;
  }
}

  const top=document.createElement("div");top.className="contacttop";

  const time=document.createElement("small");time.textContent=name==="Brian"?"ahora":"hace 1 min";
  top.append(b,time);
  const preview=document.createElement("div");preview.className="preview";preview.textContent=last;
  main.append(top,preview);el.append(av,main);el.onclick=()=>openChat(name);body.appendChild(el);
 });
 const tip=document.createElement("p");tip.className="muted";tip.textContent="Conversaciones ficticias · No se envían mensajes reales.";body.appendChild(tip);
}
function openChat(name){
 activeChat=name;$("apptitle").textContent=name;
 const body=$("appbody");body.innerHTML="";
 const list=document.createElement("div");
 chats[name].forEach(m=>{
  const b=document.createElement("div");b.className="bubble "+(m[0]==="me"?"me":"");b.textContent=m[1];list.appendChild(b);
 });
 body.appendChild(list);
 const time=document.createElement("div");time.className="bubbletime";time.textContent="iMessage · hoy";body.appendChild(time);
 const form=document.createElement("form");form.id="chatinput";
 const input=document.createElement("input");input.placeholder="iMessage";input.autocomplete="off";
 const send=document.createElement("button");send.type="submit";send.textContent="↑";
 form.append(input,send);body.appendChild(form);
 form.onsubmit=e=>{
  e.preventDefault();const val=input.value.trim();if(!val)return;
  chats[name].push(["me",val]);
  const b=document.createElement("div");b.className="bubble me";b.textContent=val;list.appendChild(b);
  input.value="";body.scrollTop=body.scrollHeight;
 };
 body.scrollTop=body.scrollHeight;
}
function renderPhone(){
 const body=$("appbody");
 body.innerHTML="<h3>Recientes</h3>";
 [
  ["Brian","Llamada perdida · ahora"],
  ["Brian","Llamada perdida · hace 2 min"],
  ["Brian","Llamada perdida · hace 5 min"],
  ["Mateo","Llamada saliente · ayer"]
 ].forEach(item=>{
  const el=document.createElement("div");el.className="contact";
  el.innerHTML="<div class='avatar' style='background:#e8e8ef'>☎</div><div class='contactmain'><div class='contacttop'><b></b></div><div class='preview'></div></div>";
  el.querySelector("b").textContent=item[0];el.querySelector(".preview").textContent=item[1];
  body.appendChild(el);
 });
 const note=document.createElement("p");note.className="muted";note.textContent="Llamadas simuladas. No se realizan llamadas reales.";body.appendChild(note);
}
function renderSettings(){
 const body=$("appbody");body.id="appbody";
 body.innerHTML="<div id='settings'><h3>Armando's iPhone</h3><p>Personalización del AU</p><label>Nombre de la pantalla</label><input id='rename' value='Armando ♡'><br><br><button onclick='changeName()'>Cambiar nombre</button><p class='muted'>Fondos: lockscreen.jpg y homewallpaper.jpg</p><p class='muted'>La clave de esta historia es 2004. No es seguridad real.</p><button onclick='replayStory()'>Reiniciar llegada de notificaciones</button></div>";
}
function changeName(){
 const val=$("rename").value.trim();
 if(val){$("homeheader").querySelector("h1").textContent=val;toast("Ajustes","Nombre actualizado.");}
}
function replayStory(){
 storyTimers.forEach(clearTimeout);storyTimers=[];storyStarted=false;
 $("notifications").innerHTML="";startStory();toast("Historia","Las notificaciones volverán a llegar.");
}

// Gesto de deslizar hacia arriba en la pantalla bloqueada.
let touchY=null;
$("lock").addEventListener("touchstart",e=>{touchY=e.touches[0].clientY;},{passive:true});
$("lock").addEventListener("touchend",e=>{
 if(touchY!==null && touchY-e.changedTouches[0].clientY>45)showPass();
 touchY=null;
},{passive:true});
$("lock").addEventListener("click",e=>{
 if(e.target.id==="lock"||e.target.id==="lockwall"||e.target.id==="lockhead")showPass();
});
$("phone").addEventListener("touchstart",e=>{
 if(unlocked&&e.touches[0].clientY>window.innerHeight-35)window._homeGesture=e.touches[0].clientY;
},{passive:true});
$("phone").addEventListener("touchend",e=>{
 if(unlocked&&window._homeGesture&&window._homeGesture-e.changedTouches[0].clientY>30){
  if($("appview").style.display==="block")goHome();
 }
 window._homeGesture=null;
},{passive:true});

// Simula notificaciones aunque el usuario tarde en desbloquear.
startStory();
</script>
